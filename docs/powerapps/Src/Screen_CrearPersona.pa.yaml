Screens:
  Screen_CrearPersona:
    Properties:
      BackgroundImage: =Concatenate("data:image/svg+xml;base64,","")
      Fill: =RGBA(0, 0, 0, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - img_credencialesCrearUser:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =146
            Image: =Concatenate("data:image/svg+xml;base64,","")
            Width: =572
            X: =38
            Y: =825
      - bt_registrarPersona:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledFill: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Font.'Open Sans'
            Height: =81
            HoverBorderColor: =
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =
            OnSelect: |+
              =If(IsBlank(txt_apellido.Text) Or IsBlank(txt_NombrePersona.Text) Or IsBlank(txt_celular.Text) Or cmbox_rolCP.Selected.Value = "Elegir" Or Text(datepicker_fechaCP.SelectedDate, "[$-es-ES]dd/mm/yyyy") = Text(Today(), "[$-es-ES]dd/mm/yyyy"),
              Set(PopUpFaltanCamposCP,true),

              If(Find("@@",txt_correoElectronico.Text) <> Blank() Or Find("@",txt_correoElectronico.Text) = Blank() Or Find(".con",Right(txt_correoElectronico.Text,8)) <> Blank(),
              Set(PopUpMailIncorrecto,true),






              Set(PopUpLoadingCP,true);

              Patch(Usuarios, Defaults(Usuarios), {

                  Nombre:Proper(txt_NombrePersona.Text),
                  Apellido:Proper(txt_apellido.Text),
                  Concat_Nombre_Apellido: Proper(txt_apellido.Text) & ", " & Proper(txt_NombrePersona.Text),
                  Telefono:txt_celular.Text,
                  Usuario: Left(Proper(txt_NombrePersona.Text),3) & Lower(txt_apellido.Text),
                  Password: Substitute(Text(datepicker_fechaCP.SelectedDate, "[$-es-ES]dd/mm"),"/",""),
                  Cumpleaños:Text(datepicker_fechaCP.SelectedDate, "[$-es-ES]dd/mm"),
                  FechaNac_USR:Text(datepicker_fechaCP.SelectedDate, "[$-es-ES]dd/mm/yyyy"),
                  Status: "ALTA",
                  Rol:cmbox_rolCP.Selected.Value,
                  Correo:txt_correoElectronico.Text

              }) ;

              ClearCollect(CollectUsuarios, Usuarios);
              Set(ResetAddPersona,true);
              Set(ResetAddPersona,false);
              Set(PopUpLoadingCP,false);
              Navigate(Screen_ABM,ScreenTransition.Fade)

              ))
            PressedBorderColor: =RGBA(9, 33, 98, 1)
            PressedColor: =Self.Fill
            PressedFill: =
            Text: =""
            Width: =572
            X: =34
            Y: =1012
