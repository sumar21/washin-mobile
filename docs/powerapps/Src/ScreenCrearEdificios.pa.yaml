Screens:
  ScreenCrearEdificios:
    Properties:
      BackgroundImage: =Concatenate("data:image/svg+xml;base64,","")
      Fill: =Color.Black
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Button6_4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledFill: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Font.'Open Sans'
            Height: =81
            HoverBorderColor: =
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =
            OnSelect: |-
              =
              If(latitudEdificio.Text = Blank() Or IsBlank(codigoEdificio.Text) Or IsBlank(nombreEdificio.Text) Or longitudEdificio.Text = Blank() Or direccionEdificio.Text = Blank() Or correoEdificio.Text = Blank()

              Or latitudEdificio.Text = "" Or codigoEdificio.Text = "" Or nombreEdificio.Text = "" Or longitudEdificio.Text = "" Or direccionEdificio.Text = "" Or correoEdificio.Text = ""


              ,

              Set(PopUpFaltanCamposEdificio,true),

              If(Find("@@",correoEdificio.Text) <> Blank() Or Find("@",correoEdificio.Text) = Blank() Or Find(".con",Right(correoEdificio.Text,8)) <> Blank(),

              Set(PopUpMailIncorrecto,true),




              Set(PopUpLoadingCrearEdificio,true);

              Patch('ABM.Edificios', Defaults('ABM.Edificios'), {

                  Edificio: nombreEdificio.Text,
                  Direccion: Upper(direccionEdificio.Text),
                  Codigo: codigoEdificio.Text,
                  Concat_Edificio_Direccion: nombreEdificio.Text & " - " & direccionEdificio.Text ,
                  Latitud: Value(Substitute(latitudEdificio.Text,".",",")),
                  Longitud: Value(Substitute(longitudEdificio.Text,".",",")),
                  Título: "[sumar]",
                  Status: "ALTA",
                  Correo: correoEdificio.Text,


                  Latitud_ED:Substitute(Left(latitudEdificio.Text,Find(",",Substitute(latitudEdificio.Text,".",","))) &   
                  Mid(latitudEdificio.Text,Find(",",Substitute(latitudEdificio.Text,".",",")) +1,3),".",","),

                  Longitud_ED: Substitute(Left(longitudEdificio.Text,Find(",",Substitute(longitudEdificio.Text,".",","))) &   
                  Mid(longitudEdificio.Text,Find(",",Substitute(longitudEdificio.Text,".",",")) +1,3),".",",")

              }) ;

              Set(VarCodigoMod, Blank());
              ClearCollect(CollectEdificiosABM, 'ABM.Edificios');
              ClearCollect(CollectEdificios,Filter('ABM.Edificios',Status = "ALTA"));
              Set(resetCrearEdificio,true);
              Set(resetCrearEdificio,false);
              Set(PopUpLoadingCrearEdificio,false);
              Navigate(Screen_ABM,ScreenTransition.Fade)



              )

              )
            PressedBorderColor: =RGBA(9, 33, 98, 1)
            PressedColor: =Self.Fill
            PressedFill: =
            Text: =""
            Width: =572
            X: =34
            Y: =1012
