                  NroCircuito_R:Value(NroCircuito),
                  NroRuta_R:NroRuta,
                  HoraSugerida_R:HoraSugerida,
                  IDUnico:VarIdUnico,
                  Nombre:VarUsuario,
                  HoraVisita:VarHoraVisita,
                  'Fecha (Fecha0)':Text(Today(), "[$-es-ES]dd/mm/yyyy"),
                  MesAño:Text(Today(), "[$-es-ES]mm/yyyy"),
                  Estado: "Pendiente",
                  VersionApp_R:VarVersion

              });

              Patch('15.ResumenPlanificaciones',LookUp('15.ResumenPlanificaciones',IDUnivocoRuta_RP = IDUnivoco),{Status_RP:"En Proceso"});
              Patch('16.DetallePlanificaciones',LookUp('16.DetallePlanificaciones',IDUnivocoCircuito_DP = IDCircuito),{Status_DP:"En Proceso"});

              UpdateContext({IDCircuito:Blank()});
              UpdateContext({ObservacionesED:Blank()});
              UpdateContext({HoraSugerida:Blank()});
              UpdateContext({NroRuta:Blank()});
              UpdateContext({NroCircuito:Blank()});



              ClearCollect(GalHome,Sort(Filter('01.Registros', (MesAño = Text(Today(), "[$-es-ES]mm/yyyy") Or MesAño = Text(DateAdd(Today(),-1,TimeUnit.Months), "[$-es-ES]mm/yyyy"))), ID, SortOrder.Descending));
