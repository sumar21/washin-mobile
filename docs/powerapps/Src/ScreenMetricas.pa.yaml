              =If(TipoMetrica = "Reporte de Problemas" And !IsEmpty(CollectReporteProblemasFiltrada),
              Set(PopUpLoadingMetricas,true);
              ForAll(CollectReporteProblemasFiltrada,Collect(CollectExport,
