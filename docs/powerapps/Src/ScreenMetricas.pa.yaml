                          CollectExport,A_Fecha,B_Edificio,C_ItemCheckList,D_Observaciones
                          ),
                          JSONFormat.IncludeBinaryData & JSONFormat.IgnoreUnsupportedTypes
                      )
                  ).url);
              Launch(_url & "?download=1");



              Clear(CollectExport);


              Set(PopUpLoadingMetricas,false),

              If(!IsEmpty(CollectMetricasFiltrada) And TipoMetrica = "Reporte General",

              Set(PopUpLoadingMetricas,true);
              ForAll(CollectMetricasFiltrada,Collect(CollectExport,
              {
                  C_Edificio: ThisRecord.Edificio,
                  B_Usuario:ThisRecord.Nombre,
                  A_Fecha:ThisRecord.'Fecha (Fecha0)',
                  D_HoraInicio:ThisRecord.HoraVisita,
                  E_HoraFinal:ThisRecord.HoraSalida
              }));


              Set(_url,Washinn.Run(
                      JSON(ShowColumns(
                          CollectExport,A_Fecha,B_Usuario,C_Edificio,D_HoraInicio,E_HoraFinal
                          ),
                          JSONFormat.IncludeBinaryData & JSONFormat.IgnoreUnsupportedTypes
                      )
                  ).url);
              Launch(_url & "?download=1");

              Clear(CollectExport);

              Set(PopUpLoadingMetricas,false)




