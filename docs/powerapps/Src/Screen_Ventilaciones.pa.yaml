      - bt_aceptar_FVE:
          Control: Classic/Button@2.2.0
          Group: Group_Finalizar
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0.22)
            DisabledFill: =RGBA(0, 0, 0, 0.22)
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Font.'Open Sans'
            Height: =66
            HoverBorderColor: =
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =
            OnSelect: |-
              =UpdateContext({LoadingVentilaciones:true});

              Refresh('ABM.Edificios');

              UpdateContext({EdificioRegistro:LookUp('ABM.Edificios',ID = RegistroVentilacion.IDEdificio_VE)});

              Patch('19.Ventilaciones',RegistroVentilacion,{
                  Estado_VE:"Realizada",
                  ObservacionResuelto_VE:txt_descripcionFinalizacion_FVE.Value,
                  FechaFinalizacion_VE:Text(Today(), "[$-es-ES]dd/mm/yyyy"),
                  FechaMesAnoFinalizacion_VE:Text(Today(), "[$-es-ES]mm/yyyy"),
                  FechaAnoFinalizacion_VE:Text(Today(), "[$-es-ES]yyyy"),
                  HoraFinalizacion_VE:Text(Now(), "[$-es-ES]HH:mm"),
                  VersionResuelto_VE:VarVersion,
                  Orden_VE:"1"
              });

              Patch('19.Ventilaciones',Defaults('19.Ventilaciones'),{
                  Título:"sumar",
                  EsIncidente_VE:"NO",
                  Estado_VE:"Pendiente",
                  DireccionEdificio_VE:EdificioRegistro.Direccion,
                  Edificio_VE:EdificioRegistro.Edificio,
                  IDEdificio_VE:EdificioRegistro.ID,
                  Grupo_VE:EdificioRegistro.GrupoVentilacion_ED,
                  Frecuencia_VE:EdificioRegistro.Frecuencia_ED,
                  FechaUltima_VE:Text(Today(), "[$-es-ES]dd/mm/yyyy"),
                  ProximaLimpieza_VE:Text(DateAdd(Today(),EdificioRegistro.Frecuencia_ED,TimeUnit.Days), "[$-es-ES]dd/mm/yyyy"),
                  FechaMesAnoProxima_VE:Text(DateAdd(Today(),EdificioRegistro.Frecuencia_ED,TimeUnit.Days), "[$-es-ES]mm/yyyy"),
                  FechaAnoProxima_VE:Text(DateAdd(Today(),EdificioRegistro.Frecuencia_ED,TimeUnit.Days), "[$-es-ES]yyyy"),
                  Orden_VE:"4"
              });

              Refresh('19.Ventilaciones');
              ClearCollect(CollectVentilaciones,Filter('19.Ventilaciones',(Estado_VE = "Asignada" Or Estado_VE = "Programada") And IDAsignado_VE = RegistroUser.ID));

              If(!IsBlank(agregarFoto_VE.Media),
              'WashInn-FotoVentilacion'.Run(RegistroVentilacion.ID,Substitute(JSON(img_fotoVentilacion_FV.Image, JSONFormat.IncludeBinaryData),"""",""),agregarFoto_VE.FileName)
              );

              UpdateContext({EdificioRegistro:Blank()});
              UpdateContext({RegistroVentilacion:Blank()});
              Reset(agregarFoto_VE);Reset(txt_descripcionFinalizacion_FVE);

              UpdateContext({LoadingVentilaciones:false});
              UpdateContext({PopUpFinalizarVentilacion:false})
            PressedBorderColor: =RGBA(28, 165, 235, 1)
            PressedColor: =Self.Fill
            PressedFill: =
            Text: =""
            Visible: =PopUpFinalizarVentilacion
            Width: =252
            X: =331
            Y: =737
