App:
  Properties:
    BackEnabled: =false
    OnStart: |-
      =Set(PopUpTransition, true );

      ClearCollect(CollectEdificios,Filter('ABM.Edificios',Status = "ALTA"));
      ClearCollect(CollectMarcaModelo,Filter('99.ABM_MaquinasCompra',Status_MC ="Activo"));
      ClearCollect(CollectMotivosCancelar,Filter('99.MotivosCancelacion',Status_MC = "Activo"));
      Set(VarPasswordOculta,true);

      ClearCollect(CollectUsuarios,Filter(Usuarios,Status="ALTA"));

      ClearCollect(CollectFechas, Filter('99.ABM_FechasFestivas', (AppPopUp_FF = "TODAS" Or AppPopUp_FF = "Washinn") And Status_FF ="Inactivo")) ;

      Set(PopUpTransition, false )
    Theme: =PowerAppsTheme
