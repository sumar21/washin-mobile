              ClearCollect(CollectDMFiltrada,Filter(CollectDetalleMaquina, Encendido_DM = cmbox_encedido_DM.Selected.Value And Modelo_DM = cmbox_modelo_DM.Selected.Value)),

              If(!IsBlank(cmbox_marca_DM.Selected.Value) And !IsBlank(cmbox_encedido_DM.Selected.Value) And !IsBlank(cmbox_modelo_DM.Selected.Value),
              ClearCollect(CollectDMFiltrada,Filter(CollectDetalleMaquina, Encendido_DM = cmbox_encedido_DM.Selected.Value And Marca_DM = cmbox_marca_DM.Selected.Value And Modelo_DM = cmbox_modelo_DM.Selected.Value))

