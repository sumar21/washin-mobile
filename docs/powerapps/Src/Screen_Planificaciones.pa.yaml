      - img_registroVisita:
          Control: Image@2.2.3
          Group: Group_VisitaEspontanea
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =171
            Image: |-
              =If(IsEmpty(Filter(GalHome,Estado = "Pendiente" And Nombre = VarUsuario)),
              Concatenate("data:image/svg+xml;base64,","
              "),


              Concatenate("data:image/svg+xml;base64,","")

              )
            OnSelect: |+
              =    If(IsEmpty(Filter(GalHome,Estado = "Pendiente" And Nombre = VarUsuario)),
                  //ClearCollect(CollectTempEdificios;Filter(CollectEdificios;Abs(Location.Latitude - Latitud) < 0,01 And Abs(Location.Longitude - Longitud) < 0,01));;
                      // Mide la longitud y latitud actuales vs las de base REDONDEADAS!
                      ClearCollect(CollectTempEdificios,Filter(CollectEdificios,
                      (Abs(Location.Latitude - Latitud_ED) < 0.001 Or Abs(Location.Latitude - Latitud2_ED) < 0.001) And 
                      (Abs(Location.Longitude - Longitud_ED) < 0.001 Or Abs(Location.Longitude - Longitud2_ED) < 0.001))
                      );


                      Set(VarCodigo,LookUp(CollectEdificios,
                      (Abs(Location.Latitude - Latitud_ED) < 0.001 Or Abs(Location.Latitude - Latitud2_ED) < 0.001) And 
                      (Abs(Location.Longitude - Longitud_ED) < 0.001 Or Abs(Location.Longitude - Longitud2_ED) < 0.001) ,
                      Codigo));
                      Set(DireccionRV,Proper(LookUp(CollectEdificios,Codigo = VarCodigo,Direccion)));

                      //Si no hay registros es porque no estas en una ubicacion registrada
                      If(CountRows(CollectTempEdificios)=0,Set(PopUpUbicacionIncorrecta,true),

                      //Si hay mas de 2 edificios con la misma direct te deja elegir
                      If(CountRows(CollectTempEdificios)=1,Set(PopUpRegistrarVisita,true),Set(PopUpRegistrarVisitaMultiple,true)))
                  )

            Width: =276
            X: =38
            Y: =915
