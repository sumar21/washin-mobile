Screens:
  ScreenStart:
    Properties:
      BackgroundImage: =Concatenate("data:image/svg+xml;base64,","")
      Fill: =Color.Black
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - timer_start_SS:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =If(PopUpTransition = false, true, false)
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(0, 0, 0, 0)
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Duration: =10
            Fill: =RGBA(0, 0, 0, 0)
            Font: =Font.'Open Sans'
            Height: =68
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnTimerEnd: =Navigate(ScreenLogin,ScreenTransition.Fade)
            OnTimerStart: =If(PopUpTransition = false, true, false)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Visible: =false
            Width: =309
            X: =40
            Y: =40
