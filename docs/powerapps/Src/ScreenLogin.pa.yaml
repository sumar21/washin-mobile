            HoverBorderColor: =
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =
            OnSelect: "=Set(PopUpLoadingLoginSL, true);\r\n\r\nIf(IsBlank(input_password_SL.Text) Or IsBlank(input_usuario_SL.Text),Set(PopUpCamposIncompletosSRA, true),\r\n\r\nIf(input_password_SL.Text = LookUp(CollectUsuarios,Usuario=input_usuario_SL.Text ,Password), \r\n\r\nSet(VarPasswordMostrar, \"OFF\");\r\nSet(VarPasswordOculta, true);\r\nSet(VarPasswordOculta2, false);\r\n\r\nSet(VarUsuario, input_usuario_SL.Text);\r\nSet(RegistroUser,LookUp(CollectUsuarios,Usuario = VarUsuario And Password = input_password_SL.Text));\r\nSet(NombreUser,LookUp(CollectUsuarios,Usuario = VarUsuario,Concat_Nombre_Apellido));\r\n\r\nSet(VarVersion,lbl_versionapp_SL.Text);\r\nSet(PopUpLoadingHM,true);\r\nSet(VarTipoUser,LookUp(CollectUsuarios,Usuario =input_usuario_SL.Text,Rol));\r\n\r\n// Fechas Festivas\r\n\r\nIf(!IsEmpty(Filter(CollectFechas,DateValue(Fecha_FF) <= DateValue(Text(Today(), \"[$-es-ES]dd/mm\")) And DateValue(FechaFin_FF) >= DateValue(Text(Today(), \"[$-es-ES]dd/mm\")))),\r\n    \r\nSet(FechaFestiva,LookUp(CollectFechas,DateValue(Fecha_FF) <= DateValue(Text(Today(), \"[$-es-ES]dd/mm\")) And DateValue(FechaFin_FF) >= DateValue(Text(Today(), \"[$-es-ES]dd/mm\")),Festividad_FF)));\r\n    \r\nIf(IsEmpty(Filter('01.BackLog_Festividades',User_BF = NombreUser And Festividad_BF = FechaFestiva And Ano_BF = Text(Today(), \"[$-es-ES]yyyy\") And App_BF = \"Washinn\")),\r\nSet(PopUpFestividades,FechaFestiva));\r\n\r\nClearCollect(CollectHorasDescanso,Filter('14.HorasDescanso',Status_HD = \"Activo\" And User_HD = VarUsuario And Fecha_HD = Text(Today(), \"[$-es-ES]dd/mm/yyyy\")));\r\n\r\n\r\nClearCollect(GalHome,Sort(Filter('01.Registros', (MesAño = Text(Today(), \"[$-es-ES]mm/yyyy\") Or MesAño = Text(DateAdd(Today(),-1,TimeUnit.Months), \"[$-es-ES]mm/yyyy\"))), ID, SortOrder.Descending));\r\n\r\n\r\nClearCollect(Collect_LPP,Filter('99.ListaPermisosMobile',Status_LPP = \"Activo\"));\r\n\r\nClearCollect(CollectScanneos,Filter('03.ScanneoCodigos',FechaMesAno_SC   = Text(Today(), \"[$-es-ES]mm/yyyy\") And Usuario_SC = VarUsuario And Estado_SC = \"Pendiente\"));\r\n\r\n\r\nIf(CountRows(Filter(GalHome,Estado = \"Pendiente\" And Nombre = input_usuario_SL.Text)) > 0,\r\nSet(VarCodigo,LookUp(GalHome,Estado = \"Pendiente\" And Nombre = input_usuario_SL.Text,Codigo));\r\nSet(VarIdUnico,LookUp(GalHome,Estado = \"Pendiente\" And Nombre = input_usuario_SL.Text,IDUnico))\r\n\r\n);\r\n\r\nClearCollect(CollectChecklist,'ABM.Checklist');\r\n\r\nIf(IsEmpty(Filter(GalHome,Nombre =  VarUsuario And Estado = \"Pendiente\")),\r\nClearData();\r\nClearCollect(CollectChecklistSV,'ABM.Checklist'),\r\nIfError(LoadData(CollectHoraInicio,\"HoraInicioSaved\"),\r\nNotify(\"No Hay Nada en Caché\");\r\nClearCollect(CollectChecklistSV,'ABM.Checklist'),\r\nLoadData(CollectChecklistSV,\"CheckListConSaveData\");\r\nLoadData(CollectOBSGenerales,\"OBSGeneralesSaved\");\r\nLoadData(CollectHoraFinCheck,\"FinCheckSaved\");\r\nLoadData(CollectHoraInicio,\"HoraInicioSaved\")));\r\n\r\n\r\n\r\n\r\n\r\n\r\nClearCollect(CollectMails,'99.ABM_Emails');\r\nReset(input_usuario_SL);\r\nReset(input_password_SL);\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n/*\r\nIfError(LoadData(CollectHoraInicio;\"HoraInicioSaved\");\r\nNotify(\"No Hay Nada en Caché\");;\r\nClearCollect(CollectChecklist;'ABM.Checklist');\r\nLoadData(CollectChecklist;\"CheckListConSaveData\");;\r\nLoadData(CollectOBSGenerales;\"OBSGeneralesSaved\");;\r\nLoadData(CollectHoraFinCheck;\"FinCheckSaved\");;\r\nLoadData(CollectHoraInicio;\"HoraInicioSaved\")\r\n)\r\n\r\n\r\n\r\n\r\nLoadData(CollectHoraInicio;\"HoraInicioSaved\");;\r\nIf(IsEmpty(CollectHoraInicio);\r\nClearCollect(CollectChecklist;'ABM.Checklist');\r\nLoadData(CollectChecklist;\"CheckListConSaveData\");;\r\nLoadData(CollectOBSGenerales;\"OBSGeneralesSaved\")\r\n);;\r\n\r\n;;\r\nSet(VarMediaGral;LookUp(CollectOBSGenerales;ID = 1;FotoOBSGeneral_SC));;\r\nSet(VarObsGral;LookUp(CollectOBSGenerales;ID = 1;ObservacionGeneral))\r\n*/\r\n\r\nSet(PopUpLoadingHM,false);\r\nNavigate(ScreenHome,ScreenTransition.Cover)\r\n\r\n\r\n,\r\nSet(VarContraseñaIncorrecta, true)));\r\nSet(PopUpLoadingLoginSL, false);\r\n\r\n\r\n\r\n\r\n/*Set(LongAux;-58,423048333238);;\r\nSet(LatAux;-34,5871777209123)*/"
