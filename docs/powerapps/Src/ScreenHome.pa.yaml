            HoverFill: =
            OnSelect: |+
              =//ClearCollect(CollectTempEdificios;Filter(CollectEdificios;Abs(Location.Latitude - Latitud) < 0,01 And Abs(Location.Longitude - Longitud) < 0,01));;


              // Mide la longitud y latitud actuales vs las de base REDONDEADAS!
              ClearCollect(CollectTempEdificios,Filter(CollectEdificios,Abs(Location.Latitude - Latitud_ED) < 0.001 And Abs(Location.Longitude - Longitud_ED) < 0.001));
              Set(PopUpLoadingHM,true);

              //ClearCollect(CollectTempEdificios;Filter(CollectEdificios;Abs(LatAux - Latitud) < 0,000000000001 And Abs(LongAux - Longitud) < 0,000000000001));;


              //Set(VarCodigo;LookUp(CollectEdificios;Abs(Location.Latitude - Latitud) < 0,01 And Abs(Location.Longitude - Longitud) < 0,01 ;Codigo));;
              Set(VarCodigo,LookUp(CollectEdificios,Abs(Location.Latitude - Latitud_ED) < 0.001 And Abs(Location.Longitude - Longitud_ED) < 0.001 ,Codigo));
              //Set(VarCodigo;LookUp(CollectEdificios;Abs(LatAux - Latitud) < 0,000000000001 And Abs(LongAux - Longitud) < 0,000000000001 ;Codigo));;
              Set(DireccionRV,Proper(LookUp(CollectEdificios,Codigo = VarCodigo,Direccion)));

              //Si no hay registros es porque no estas en una ubicacion registrada
              If(CountRows(CollectTempEdificios)=0,Set(PopUpUbicacionIncorrecta,true),


              //Si hay mas de 2 edificios con la misma direct te deja elegir
              If(CountRows(CollectTempEdificios)=1,Set(PopUpRegistrarVisita,true),Set(PopUpRegistrarVisitaMultiple,true)));




              Set(PopUpLoadingHM,false);




